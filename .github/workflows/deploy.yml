# main 에 푸시되면 Vite 로 빌드해서 GitHub Pages 에 배포한다.
#
# 이전 워크플로(static.yml)는 저장소 루트를 그대로 올리는 방식이었다.
# 바닐라 JS 였을 때는 그걸로 됐지만, 지금은 빌드 산출물(dist)을 올려야 하므로
# build / deploy 두 잡으로 나눴다.
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # Actions 탭에서 수동 실행도 가능하게 둔다
  workflow_dispatch:

# GITHUB_TOKEN 에 Pages 배포 권한을 준다
permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나만. 진행 중인 배포는 끊지 않는다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "dist"

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
